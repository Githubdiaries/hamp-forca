name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U hamper -d hamper_forecast && exit 0
            sleep 2
          done
          exit 1

      - name: Run test suite
        run: docker compose --profile test run --rm test
